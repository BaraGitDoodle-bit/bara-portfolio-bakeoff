<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nur Toha Mubarak — Portfolio</title>
<style>
:root {
  --bg: #FBF8F2;
  --ink: #171310;
  --accent: #C65B37;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  padding: 0;
  background-color: var(--bg);
  color: var(--ink);
  font-family: 'Inter', sans-serif;
  line-height: 1.6;
}

/* Skip link */
.skip-link {
  position: absolute;
  top: 0; left: 0;
  background: var(--accent);
  color: #fff;
  font-weight: 700;
  padding: 0.5rem 1rem;
  z-index: 100;
}
.skip-link:focus {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}

/* Layout */
main {
  max-width: 1080px;
  margin: 0 auto;
  padding: 2rem 1rem 4rem;
}

/* Header */
header {
  text-align: center;
  padding: 1.5rem 2rem 2rem;
  background: var(--bg);
  border-bottom: 1px solid #eee;
}
header h1 {
  font-size: 2.75rem;
  margin: 0 0 0.5rem;
  color: var(--ink);
}
.header-sub {
  font-size: 1.15rem;
  color: #555;
  margin: 0.25rem 0 0;
}
.header-sub span {
  "AI Systems Builder · Automation &amp; Digital Product Development"
}

/* Hero */
.hero {
  background: white;
  border-radius: 20px;
  padding: 3rem 2rem;
  text-align: center;
  margin: 2rem 0;
}
.hero img {
  width: 100%;
  max-width: 480px;
  height: auto;
  display: block;
  margin: 0 auto 1.5rem;
  object-fit: contain;
}
.hero h2 {
  font-size: 2rem;
  margin: 0.25rem 0 0.5rem;
  color: var(--ink);
}
.hero p {
  font-size: 1.1rem;
  color: #333;
  margin: 0.5rem 0 0;
}

/* Sections */
section { margin: 2rem 0; }

.card {
  background: #FFFFFF;
  border: 1px solid #e0e0e0;
  border-radius: 20px;
  padding: 1.5rem;
  margin: 0 0 1.5rem;
  box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}
.card.featured {
  background: linear-gradient(135deg, #fafafa 0%, #fbf8f2 100%);
  border-color: var(--accent);
}
.card h2 { font-size: 1.8rem; margin-top: 1rem; }
.tagline { color: #777; font-style: italic; margin: 0.5rem 0 0; }
.desc { margin: 0.5rem 0 0; }
.stack-tags { margin: 0.75rem 0 0; font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; }
.responsible-disclosure { margin: 0.75rem 0 0; font-size: 0.95rem; color: #444; }
.status { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: #666; margin-top: 0.5rem; }

/* Grid */
.grid { display: grid; gap: 1.5rem; }
.row { display: flex; flex-wrap: wrap; gap: 1.5rem; }

/* Experience row cards */
.card h3 { font-size: 1.2rem; margin: 0 0 0.5rem; }

/* Contact */
footer {
  text-align: center;
  padding: 1rem;
  background: var(--bg);
  border-top: 1px solid #ddd;
  margin-top: 2rem;
}

/* Responsive */
@media (max-width: 390px) {
  main { padding: 1rem 0.5rem 3rem; }
  .hero { padding: 2rem 1.5rem 1.5rem; }
}
@media (max-width: 768px) {
  body { padding: 0; }
  main { padding: 1rem 0.5rem 3rem; }
  header { padding: 1rem 1.5rem 1.5rem; }
  .hero { padding: 2rem 1.5rem 1rem; }
}

/* Links - new tab, noopener noreferrer */
a[href] {
  color: var(--ink);
  text-decoration: none;
}
a[href]::marker { display: none; }
a[href] [rel="noopener noreferrer"] {
  margin-left: 0.5rem;
}
